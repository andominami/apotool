<style>
  @import url('https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=BIZ+UDPGothic:wght@400;700&family=BIZ+UDGothic:wght@400;700&display=swap');

      --ink-muted: #9BB5AF;

<body>
<div class="app">
  <header class="topbar">
    <p class="eyebrow">歯科保険算定 &middot; ルールリファレンス</p>

    <p class="lede">入力ミスや返戻につながりやすい算定ルール・カルテ記載の注意点を、キーワードでその場で引ける社内リファレンスです。</p>

    <div class="search-row">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input id="search" type="text" autocomplete="off" placeholder="キーワードで検索 (例: SPT, パノラマ, 返戻, ナイトガード)" aria-label="キーワード検索">
      <button id="clearSearch" type="button" aria-label="検索をクリア">&times;</button>

      <span><strong id="matchCount">67</strong>&nbsp;/&nbsp;<span id="totalCount">67</span> 件を表示</span>

<script>
  const DATA = [{"no": 1, "date": "2023/01/05", "category": "歯周病治療(EPP・SRP・SPT)", "title": "3回目のEPP後の処置について", "content": "3回目のEPPを行い検査に基づきSRPをした後、同月内に日数を置いてEPP4回目を算定することは基本的にしない(返戻の対象)。3回目のEPPで処置が不要なら、同月中にSPTへ入る。そうすれば翌月からSPT時にEPPの算定ができる。SPTに入れなければ、次回は検査算定なしでSPTに入るところから始まる。EPPの算定は月に一回。SRP時でなければ、SPT中に何度もEPPは算定できない。"}, {"no": 2, "date": "2023/02/05", "category": "歯周病治療(SPT・外科)", "title": "SPT中のフラップOPについて", "content": "SPT中の患者は基本的にフラップOPを行えない。OPを行う時はEPPを行い、OPが必要と診断してSPTを中断または中止する必要がある。EPPをした後にOPとするならSPTは保険算定できない。EPPしてSPTを算定すると歯周は安定期と宣言したことになり、OPの必要性が認められなくなる。OPを行う患者にはEPP精密を行い、SPTは算定せずOPに回す。"}, {"no": 3, "date": "2023/02/05", "category": "歯周病治療(外科後・SPT再開)", "title": "歯周外科処置後、再びSPTを始めるには", "content": "歯周外科処置後、再びSPTを始めるには傷が落ち着く2週間以上を空けてEPP精密を行い、その次からSPTを算定する。SPTが開始されれば、EPPと同日にSPTを算定しても問題ない。SPTは歯周安定期に入っていることを意味するため、SPTと同日にP急発の処置は算定できない。処置を算定するならSPTは算定しない。同月でもSPT算定日より前の別日であれば大丈夫。"}, {"no": 4, "date": "2023/04/04", "category": "レントゲン撮影(パノラマ/デンタル)", "title": "パノラマ撮影時の保険点数と病名の入力について", "content": "パノラマを撮影しても保険点数がデンタルの点数になっているケースがある。歯周病(P)の診断であればパノラマは402点。病名がPでパノラマを撮影しているのに点数がデンタルだと撮影理由が不明になる。う蝕が主な理由なら部位を入れて「C2の疑い」等の病名を入れる。Pの診断も兼ねるならP2と病名を入れてパノラマとして入力する。前回撮影から1年経過、または抜歯等で歯式が大きく変わった等の理由があれば1年未満でも可。"}, {"no": 5, "date": "2023/07/04", "category": "処方(SPT中)", "title": "SPT中の処方について", "content": "SPTなど管理中はP急発などによる抗菌薬・消炎薬の処方はできない。薬が必要な場合はSPT等を一旦中止する。処方を出す日にSPT等の処置は行えない。炎症などがあれば安定期とは言えない。炎症が治まるまで2週間程度待ってからEPPからやり直す。"}, {"no": 6, "date": "2024/04/06", "category": "歯周病治療(EPP・SRP)", "title": "4回目のEPPを行った後の処置について", "content": "4回目のEPPを行った患者で、再スケーリングを繰り返し行っている場合、更に再スケーリングすることは保険請求上できない(既に3回全顎スケーリング済みの患者の例)。それ以上行うならSRPに移行し、その後SPTへ進む流れとなる。"}, {"no": 7, "date": "2024/06/04", "category": "歯周病治療(SPT前後の処方)", "title": "SPT前後の処方について", "content": "SPTで管理中の患者が、同月やSPT後の短期間にP急発等の歯周病名で炎症ありとレセプト入力されていると、SPTの保険算定ができない(取り消し・返戻の対象)。ドクターと衛生士で状況を相談し対処する。"}, {"no": 8, "date": "2024/08/19", "category": "健診(KDH・小児)", "title": "KDHの検診について(受診間隔)", "content": "KDHの検診を特別な事情なく全ての子供に4ヶ月ごとに行い初診点数を算定していると、成人ケアも同様だが「かたよった傾向」とみなされ、質問状や指導が入る可能性がある。永久歯が萌出し終わり全て永久歯で、う蝕もなく指導・スケーリングのみで終える子供は次の検診を6ヶ月あける。4ヶ月以内の検診になってしまう場合は再診で指導・スケーリングを行う。"}, {"no": 9, "date": "2024/08/23", "category": "記録・記載ルール", "title": "学校口腔健診用紙の記載について", "content": "学校健診後に保護者や生徒が持参する用紙の「診断名」欄に、衛生士の判断で病名を記入しない(公的な用紙は特に注意)。実例として、誤った病名が記入されていたことがあった(KDH検診からの患者)。衛生士とドクターの説明が食い違うと保護者の不信感につながる。確定的な診断は必ずドクターが行う。"}, {"no": 10, "date": "2024/09/04", "category": "健診(KDH・小児)", "title": "KDHでのカルテ入力について(受診間隔の改善)", "content": "KDHでの子供の検診予約が全て4ヶ月ごとになっていると「偏った診療」とみなされ、返戻・多数の質問状・個別指導につながり、担当医を含め治療に支障が出ることもある。乳歯から永久歯に生え変わっており、う蝕が無い患者は次回検診を6ヶ月あける方針に変更する。"}, {"no": 11, "date": "不明(2024年頃)", "category": "他院・外科連携", "title": "中西先生への外科相談について", "content": "①抜歯相談のみの予約は控え、担当ドクターがカルテ等を用意し先に相談、外科ドクターの診断として患者に伝える(それでも難しい場合のみ予約)。②粘膜疾患等もカルテ・資料を持参してもらい直接相談する方が効率的(粘膜疾患はその時大丈夫でも後で変化することがある)。③緊急時はLINE等の利用が望ましいが、夜間の緊急外来対応等でスマートフォンを常に携帯できるとは限らないため配慮してほしい、との申し送り。"}, {"no": 12, "date": "2024/09/08", "category": "歯周病治療(スケーリング運用)", "title": "衛生士・ドクターによるケアの進め方についてのお願い", "content": "保険算定・流れは随時変わるため運用変更をお願いすることがある。歯数が少ない方(上下合計5本程度)はスケーリングを可能な限り一度で終える。嘔吐反射が強い・痛みがある・時間がない等の理由があれば無理をしなくてよい(以前は歯が20本以上残る方を一度でスケーリングすると理由を問われたことも)。毎回スケーリング未実施部位を残し2回目のEPPを行わないと、再評価もされず治療途中とみなされる恐れがある点に留意。"}, {"no": 13, "date": "2024/10/03", "category": "歯周病治療(SPT・フラップオペ)", "title": "SPT中のフラップオペについて", "content": "SPT中にフラップを行う際は、同月にその月のSPT算定が無いか確認する。フラップの前に同月のSPT算定があればフラップオペは算定できない(SPT算定は歯周が安定期に入っていると宣言していることになるため)。逆にフラップオペの算定がSPTより前にあればSPTは算定できない。該当患者はSPTの算定を取り消し予定。今後SPTに戻るには期間を置いてEPP精密を行い、安定期に戻ったことを確認する必要がある。"}, {"no": 14, "date": "2024/10/03", "category": "歯周病治療(フラップオペ)", "title": "フラップオペを行うための治療の流れについて", "content": "フラップオペを保険治療で行うにはEPP1回目から始まる決められた治療の流れを守る必要がある(赤本等で要確認)。同月にフラップオペ部位に近い所でSRPを行っている場合は、フラップオペをするなら近日でSRPは不要と考えられる。また、フラップオペ当日にEPPは行えない(フラップ後は歯周ポケット検査ができないため。行うなら2週間空ける必要がある)。電子カルテのため日付・内容データは全て共有される。治療前に確認すること。"}, {"no": 15, "date": "2024/11/07", "category": "レセプト・カルテ運用", "title": "レセプトの印字を行った後の修正について", "content": "レセプト提出のための印字・チェック・修正開始後は、報告なしにカルテ修正や登録変更をしない。特に受付は保険の変更・修正時は必ずレセプトを印字して大谷へ速やかに報告する(集計不明・業者への迷惑につながった実例あり)。"}, {"no": 16, "date": "2024/11/29", "category": "文書(情報提供書・診断書)", "title": "情報提供書、診断書について", "content": "情報提供書と診断書は基本的に別物。事故等の後で時間・期間が空くと、症状が事故によるものか不明になり診断書が書けない場合がある。患者からの依頼を受ける際はその点も確認する。事故後は早期に受診した医療機関にまず相談してもらうのが望ましい。患者に話した・説明した内容は記録簿に必ず記入し、誰が記載したかも分かるようにする。"}, {"no": 17, "date": "2025/04/07", "category": "レセプト・カルテ運用", "title": "カルテ修正に伴う医療費の過不足について", "content": "カルテ修正や施設基準の変更に伴い医療費の過不足が発生する(修正は必要な対応。ケアのみの患者にも修正あり)。各ドクター・DHが患者へ説明する。ケア等、衛生士に関わる施設基準変更に伴う点数修正は大谷が行う。不足金が出た方はエラー修正表を受付に置く(4月1日・2日分以降は自動修正に設定。不具合は報告)。"}, {"no": 18, "date": "2025/05/10", "category": "口腔機能発達不全症(MFT/バイオ)", "title": "バイオ(MFT)に係っている皆さんへ", "content": "バイオセラピー等で口腔機能訓練を保険で行うには「口腔機能発達不全症」の診断が必要(診断はドクターのみ)。診断後は管理計画書を歯科コンに入力・印刷し保護者/本人へ渡す(控えはカルテまたはPC内保存)。3ヶ月に1回の再評価・計画見直しが必要(未実施の患者あり)。評価項目にはカウプ指数、身長・体重等があり、3項目以上「問題あり」で発達不全症と判定。訓練内容決定後、再評価で不足があれば計画変更・追加(変更時は再度計画書作成)。"}, {"no": 19, "date": "2025/05/12", "category": "健診→治療移行の入力", "title": "健康診断からの移行の入力について", "content": "①健診は保険治療ではないため保険点数は算定できない。健診受診後そのまま治療へ移行する場合、健診が初診に相当し、次に行う保険治療は「再診」となる。治療開始日は実際に治療を始めた日とし、健診日が治療開始日にならないよう患者登録を修正する。②カルテ入力は「健康診断の結果に基づき治療開始」と入力し、P・G等の病名から項目を選択して入力する。"}, {"no": 20, "date": "2025/06/08", "category": "口腔機能発達不全症(MFT/バイオ)", "title": "小児のバイオセラピー、食事指導について", "content": "バイオセラピー(機能訓練・指導)を行うには、まず歯科医師の診断・指示が必要。食事指導でも歯科医師が「発達不全」「発達不全の疑い」等の病名をつけることで保険点数を算定できる。小児本人が回答できなくても、保護者へのアシスメントで問題点が分かれば診断可能。既存のアシスメント表・アンケート表を再整備予定。食事指導前には大谷へ声かけを。"}, {"no": 21, "date": "2025/07/03", "category": "口腔機能発達不全症(MFT/バイオ)", "title": "乳児や小児の口腔機能発達不全症の診断について(写真・入力)", "content": "①訓練・指導が必要と思われる発達不全がある患者は、口腔内上下顎・正面咬合、顔の正面・横顔、全身正面・横の写真を撮影(床矯正診断用の撮影を参考に。乳児等で難しい場合は顔の正面・横顔のみでも可、口元がわかることが必要)。②歯科コンまたは配布用紙にカルテナンバー・氏名等を記載後、「評価」項目の「問題なし・あり」を保護者/本人への聞き取りで記入(不明な項目は「不明」と記載。歯科コンの場合はカルテ記録簿に記載)。"}, {"no": 22, "date": "2025/07/03", "category": "口腔機能発達不全症(MFT/バイオ)", "title": "乳児や小児の口腔機能発達不全症の診断について(診断・管理料)", "content": "以上の情報からドクターが「口腔機能発達不全症」かどうかを診断する(直接ユニットで見なくても診断可能な場合がある)。指導・訓練を行うかの判断もドクターが行う。「管理計画」の評価項目は全国共通(保険点数の算定要件)。ドクターの指示があれば衛生士・栄養士が訓練・指導しても算定可能(訓練・指導自体は必ずしもドクターが行う必要はないが、診断は必ずドクターが行う)。診断されれば食事指導も治療の一環となり「小児口腔機能管理料」が算定できる(訓練のみが管理ではない)。再評価は別途後日案内。"}, {"no": 23, "date": "2025/09/05", "category": "レントゲン撮影(デンタル)", "title": "デンタル撮影の件", "content": "ドクターの指示のもと衛生士がデンタルレントゲン撮影を行う際は、部位と必要な病名をドクターに確認する。カルテ入力にはそれが必要。わからない場合はカルテ入力を削除する方が良い(削除して対応)。"}, {"no": 24, "date": "2025/09/06", "category": "歯周病治療(EPP・SRP)", "title": "歯周病治療の算定について(返戻事例)", "content": "EPP①後のスケーリングが全顎終わっていないのにEPP②を行い返戻になった事例がある。以前は部分的なSRPのコメント不足でSPTに入り返戻になった事例もあった。歯科医師・衛生士とも歯周病治療の流れに注意する(返戻が増えている)。"}, {"no": 25, "date": "2025/09/06", "category": "健診→歯管の算定", "title": "健診後のお子さんの歯管について(点数誤り)", "content": "健診の次の受診でEPPや歯管をカルテ入力すると、歯科コンに自動で2回目の歯管(100点)が入ってしまうことがあるが、本来は初回の80点が正しい。月をまたぐとレセプトチェックで気づきにくい。前の来院が健診であれば、2回目の受診でも保険診療上は初回扱い。修正できない場合は早めに大谷へ報告しカルテも持参する(返戻となった事例あり)。"}, {"no": 26, "date": "2025/09/25", "category": "歯科疾患管理料", "title": "歯科疾患管理料の算定について(80点/100点)", "content": "歯科疾患管理料(歯管)は初診月は80点で算定する。健診から移行した1回目の算定も80点。健診と同月の歯管は80点で歯科コンに上がるが、月が変わると100点で出てくることがあるため80点に修正し、コメントを選んで入力する。"}, {"no": 27, "date": "2025/10/04", "category": "レントゲン撮影(パノラマ/デンタル)", "title": "ケアの方が撮るパノラマやデンタルについて", "content": "ケア担当がパノラマ・デンタルを撮影した際のカルテ入力には必ず病名をつける。パノラマ撮影済みから1年以内は、新たな病名がなければ再度パノラマレントゲン撮影の要件を満たさない。デンタルの場合は歯に関する病名をつける(不明時はドクターに確認)。"}, {"no": 28, "date": "2025/12/09", "category": "歯周病治療(SPT・P重防)", "title": "SPTやP重防などの流れについて", "content": "12月分レセプトのチェック・修正中、SPTやP重防への流れの認識が誤っているカルテ記載が見られる。EPP①のスケーリング後、EPP②は1週間以上、その後のSRPは2週間空ける。SPTに入るにはその直前か当日にEPPが必要(EPP③などがだいぶ前にある場合は不可、口腔状態の変化を問われても否定できない)。"}, {"no": 29, "date": "2025年12月頃", "category": "歯周病治療(画像活用指導料等)", "title": "歯周疾患患者画像活用指導料について", "content": "①「歯周疾患患者画像活用指導料」を保険請求するにはEPPを行いP・Gの病名が必要(写真を撮っただけでは算定不可、歯が無い部位の撮影や同一部位の複数枚撮影は1枚のみ算定)。②初診で検診目的の来院のみで他に病名が付かなければ「歯科疾患管理文書提供加算(10点)」も算定不可(う蝕のみでEPP予定が全くない場合、管理・文書提供は不要。う蝕治療終了で管理も終了)。③歯科疾患管理料の算定にはお口の状態・継続管理の内容・治療方針の記載と文書提供が基本的に必要(用紙は初診時に受付がカルテに添付)。"}, {"no": 30, "date": "2026/02/17", "category": "カルテ入力(マウスピース)", "title": "マウスピース(ナイトガード)のカルテ入力について", "content": "2個目以降のナイトガード作製には前回セットから6ヶ月以上の間隔が必要(日数計算)。新たな病名を付ける必要があり、残っている病名欄からは入力できない(義歯修理・調整等も同様)。入力できない場合は病名を付けたうえで「チェック無し」で入力し、カルテナンバーと患者名を大谷へ連絡する(算定要件に合わなければ返戻)。"}, {"no": 31, "date": "2026/02/18", "category": "歯科技工(指示書)", "title": "技工指示書について", "content": "義歯の技工指示書に設計の記入やクラスプ等材料の指示が無いものが多く見られた(義歯以外にも見られる可能性あり、厚生局からの注意対象)。技工所には指示記入の無いものは送り返すよう依頼予定。不備のあるドクターは指示書を改めて書き直す必要がある。"}, {"no": 32, "date": "2026/03/05", "category": "歯周病治療(SPT開始)", "title": "SPTの開始について", "content": "SPTの開始にあたっては歯周病検査を行い、検査結果の要点とSPTの治療方針についての計画書を作成し、患者・家族に提供、文書の写しをカルテに添付する必要がある(PC入力・印字でも手書きでも可)。管理計画書は歯管の初回用または継続用の用紙を使用できる。歯管の初回に用紙を出していれば、継続して治療していく形になる。"}, {"no": 33, "date": "不明", "category": "カルテ入力(病名・欠損部位)", "title": "カルテ入力について(P部位・義歯欠損部位の記載)", "content": "P部位にある8番にPericoの病名で抜歯、またP部位に無い歯の処置等、誤りが多く見られる。8番の抜歯病名は非埋伏の場合Perをつける運用。義歯で使用中の欠損部位を新義歯作製時に設計変更する場合は理由を摘要欄に記入する(人工歯部位の増減とも同様)。自然脱落の場合は摘要欄に「自然脱落」と部位を入力し、欠損部P部位から削除する(自然脱落は病名ではなく状態を示す記載)。DHがケア患者のデンタル撮影をする際は、検査理由が分かるよう部位・病名(例:右上6番/Cの疑い、Perの疑い)をカルテ入力する。歯科コン上のEPP・残存歯部位の情報が実際と異なる場合は大谷または担当ドクターに相談する。"}, {"no": 34, "date": "2026/05/06", "category": "健診→治療開始日", "title": "健診後の治療開始日の登録について", "content": "市等の健診の後に保険治療を行う患者(成人・子供とも)は、保険治療を開始した日が治療開始日となる。健診日は初診日だが、治療開始日をそのままにすると返戻となるため、受付にて治療開始日の登録修正が必要。"}, {"no": 35, "date": "2026/05/21", "category": "制度改定(歯周病継続支援治療)", "title": "歯周病継続支援治療について(概要資料)", "content": "保険算定改定に伴う「歯周病継続支援治療」の概要資料を共有(添付資料参照)。算定対象はG・P。医学管理として歯周病等に関する管理指導を行う。算定単位は3ヶ月に1回(2週間以上4週間未満の間隔でSC・SRP等を1回以上実施していることが要件など)。継続支援が必要な理由として、①歯周検査でポケット4mm以上・炎症所見あり、②2回目以降は歯周組織の状態悪化・指導継続・治療方針変更等が必要な場合、を摘要欄へ記載。資料の写真が不鮮明なため詳細は原資料を要確認。"}, {"no": 36, "date": "2026/05/29", "category": "歯科技工(ベースアップ支援料)", "title": "6月からのカルテ入力について(技工関連加算)", "content": "6月からインレー・クラウン・義歯等のセット時に加算点数を選択する画面が追加される見込み(咬合床含む、咬合採得方法を問われる可能性)。保険で技工指示書を出し技工士に製作を依頼した物をセットする際は、カルテ入力時「歯科技工所ベースアップ支援料」の算定確認に「はい」を選択する。院内でドクターが製作したものや衛生士作製のマウスピース、自費診療は加算対象外(画面未確認のため詳細は要確認・訂正予定)。"}, {"no": 37, "date": "2026/06/01", "category": "制度改定(初診・再診入力)", "title": "バージョンアップしたメディアのカルテ入力について", "content": "6月1日の保険算定改定に伴いレセコン(メディア)の画面が変更。カルテ入力時に「初診」「再診」「健診から移行する場合の初診」の3種類から選択する。健診からの移行で治療開始する場合は「初診・再診なし」を選択すると、初診料の摘要に「健診の結果に基づき治療を始める」旨が自動入力される(文面は多少異なる場合あり)。"}, {"no": 38, "date": "2026/06/01", "category": "制度改定(歯管・口腔機能低下症等)", "title": "6月からの保険算定の注意点", "content": "歯科疾患管理料:初診月・翌月以降も90点、6ヶ月超の算定は100点(算定時に患者へ説明しカルテに要点記載。「歯周病治療を継続して行い、歯周病の重症化を予防する」等の記載が必要)。離乳完了後(生後18ヶ月以後)から18歳未満は「口腔機能発達不全症」、それ以上は「口腔機能低下症」。口腔機能低下症疑いへの精密検査・診断に年齢制限は無く、「疑い」として検査・算定してよいが疑いのままなら2回目は無し(訓練・管理継続には確定診断が必要、訪問診療も同様)。暫間歯冠補綴装置(テンポラリークラウン・リテーナー)は処置開始日から最終補綴装置装着まで1歯1回に限り算定可(全ての歯で算定可能)。"}, {"no": 39, "date": "2026/06/01", "category": "制度改定(CAD/CAM)", "title": "6月からの保険算定について(CAD/CAM要件撤廃)", "content": "CAD/CAMクラウン・インレーの適用要件が撤廃され、全ての歯に適用可能となった。セット時はレジン系セメントを使用し、歯科技工所ベースアップ支援料を付ける。CAD/CAM冠の補管期間(2年間)は変更なし。"}, {"no": 40, "date": "2026/06/04", "category": "歯周病治療(流れ全般)", "title": "カルテ入力の注意点(歯周病治療の流れ)", "content": "EPP精密→繰り返しオペ→フラップオペ→歯肉回復を待ってオペの評価を含む検査、という流れを再確認。前の治療評価はカルテに記載・保存するのが正しい記載。保険治療は検査をしてから次の治療へ進む流れが原則。EPPを行い治療後、治療途中でも3ヶ月経過すれば歯肉等の状態変化があり得ると考えるのが通常。流れに沿わないと返戻・通知により後日算定取り消しとなる。"}, {"no": 41, "date": "2026/06/05", "category": "健診→初再診料", "title": "健診後の初再診料の算定について", "content": "健診後の治療についての質問に回答。基本的に当院では健診をしたその場でEPP・スケーリング・治療等を始めることはない。保険改正で可能とされたのは健診と直接関係のない治療。歯周病治療等も可能だが、その場でドクターが診療しなければ初診料・再診料は算定できない。同日別受診での再診は可能だが、一度帰宅して1日2回来院してもらう形になり受付手続き・入力が複雑になる。方針は医院として決定が必要。"}, {"no": 42, "date": "2026/06/06", "category": "歯科技工(ベースアップ支援料)", "title": "歯科技工所ベースアップ支援料について(義歯修理等の注意)", "content": "義歯修理や増歯の際にも技工所ベースアップ支援料を算定するか選択する画面が出るが、ドクターや衛生士が院内で修理した場合は算定不可。義歯・装置を技工所に持ち込み技工指示書を出して技工所で直してもらった場合のみ対象。算定要件に合わない場合は取り消しになるため、算定しないこと。"}, {"no": 43, "date": "2025/08/30", "category": "カルテ入力(ケア・KDH区分)", "title": "【重要】ケア・KDH入力方法変更について(9/1~)【井出真理愛】", "content": "入力ミス・取りこぼしを防ぐため9/1(月)から入力方法を変更。【以前】ケアでDr大谷のKrを診た→TC大谷/KDHでKrを診た→KDH/担当医なし→衛生士。【今後】①配属された場所+自分の名前で入力する(例:ケア○○、K○○)。常設枠が無い方はケア臨時またはKDH臨時で入力(ケア枠で子供を診た場合→ケア○○、KDH枠で大人を診た場合→K○○)。②臨時枠(特出含む)の時はそれぞれケア臨時・KDH臨時で入力。③ケア・KDHとDr枠でなな目(斜め)の場合は入力を分ける(Drで入力を分けることに意見がある方は柳田先生へ相談)。④2列目の場合は今まで通りドクター名で入力。不明点はDH主任に確認。"}, {"no": 44, "date": "2024/12/07", "category": "文書算定(歯科疾患管理料等)", "title": "【重要】文書算定について(大谷先生より/井出真理愛共有)", "content": "初回用紙または文書用紙を出す場合は必ず文書を算定する。①初回用紙の場合:控えがあるためPC上でチェック入力せずそのまま登録でよい(必ず渡す相手に記入してあることが条件)。②文書の場合:控えがないためPC上でもチェックを入れて登録する。初回用紙・文書→文書管理料(10点)、実地指導→歯科衛生士実地指導料(80点)、それぞれ算定できる。添付:「歯と口の健康のために(治療のお知らせ)」用紙の記入例(右列の画像①②参照)。"}, {"no": 45, "date": "2024/09/08", "category": "カルテ入力(Ce管理)", "title": "【重要】Ce管理の入力について【井出真理愛】", "content": "Ce管理の途中でどうしても新たに部位を増やしたい場合は、編集せず新たに部位病名を作成する(あまり頻繁には行わないこと)。詳細は添付の手書きメモ参照(1回目→A|AをCeにしたい、2回目→A|Aと隣もCeにしたい、3回目→A┃が抜けた、という進行例と入力方法)。不明点は大谷先生、有光さん、井出まで確認。"}, {"no": 46, "date": "2024/06/01", "category": "カルテ入力(1歳半健診)", "title": "1歳半健診入力について【井出真理愛】", "content": "1歳半健診の入力方法が若干変更。①歯式を単Gで入れる。②初診料の算定なしを選ぶ。③ワープロで「1歳半健診」を入れる。④写真の項目を2つ1行削除する。(添付:レセプト画面で「外来安全対策加算1」「外来感染対策加算1」等を丸で囲んだ入力例)"}, {"no": 47, "date": "2023/11/16", "category": "カルテ入力(DH会共有・小児対応全般)", "title": "DH会で話したこと(KDH)【井出真理愛】", "content": "①シーラントを増やしていく方針。萌出したての上顎45もシーラント対象歯にする(検診時に一緒に行う場合、毎回必ず検診日にできるわけではないことを説明する)。②フッ素トレー法のトレーサイズについて:1番小さい黄色トレーが販売中止になったため、今後は青と緑の2種類。乳歯列の子に合うトレーがなくなるため対応を検討中(決まり次第連絡)。③入力について:・2歳未満の子はSCは実際に行った部位のみ、EPPはガーゼで拭ってプラーク入力すればプローブできなくても入力OK。CCDは必ず撮影する。・乳歯が抜けて永久歯になった場合、電子カルテの歯式を変更し紙カルテにも正しい歯式を記録する。・電子カルテに既に表示される永久歯は絶対に消さない。・乳歯と永久歯が同時萌出している場合、電子カルテは乳歯のままにする(2つを同時に入力は絶対しない)。・Ce管理の時でも歯式は変えてよい(紙カルテに歯式を変えたことを記録する)。・保険MFT中の検診は再診から入力し、Ce管理中→Ce管理の入力、その他→処置+歯管+残りSC+機械的、で入力する。・子供の検診は4ヶ月間隔。前回Ce管理が終わっていて次回3ヶ月検診になっている子がいる場合は、再初診にせず再診のCe管理で算定し、実際は検診+Ce管理を行う。次回予約はCe管理継続または4ヶ月検診とする。"}, {"no": 48, "date": "2023/06/02", "category": "歯周病治療(SPT・P重防・カルテ入力)", "title": "*DHの方にお願い*(SPT・P重防のカルテ管理/入力ミス注意)【川崎真紀】", "content": "受付やレセプト担当の助手からの依頼。①SPT、P重防の患者にはカルテにテープを貼る。②入力ミスへの注意:・ネオステリンなど処方したら薬剤情報提供料を取る。・SRPを全顎ではなく深いところのみ行った場合は「摘要」ではなく「コメント」に入れる(例:「全顎のSRPは必要なし」とコメント入力)。・CE入力の時、P部位の入力忘れが多い→「処置なし(レセ印字あり)」から着処を入力するとP部位が入る。・P病名が単GかP2か微妙な年齢の患者は確認する。不明点は川崎まで。"}, {"no": 49, "date": "2023/02/05", "category": "カルテ入力(ナイトガード)", "title": "*DHの方へ*ナイトガードセットの入力【川崎真紀】", "content": "ナイトガードセットの入力の時は「上顎床装置セット」と摘要に入れる。先月分のレセプトで何件か記載漏れがあったため周知。"}, {"no": 50, "date": "2022/10/09", "category": "レセプト・カルテ(月次修正傾向)", "title": "★重要★歯科衛生士の方へ★(9月分レセプト修正点)【川崎真紀】", "content": "9月分のケア・KDHのレセプト修正点の傾向を共有(小児患者の入力ミスが多いため特に注意。不明点は小林さんか山下さんへ)。①Ce算定時のP部位入力忘れ:SCを入力すれば自動でP部位が入るが、SC入力がない場合は「処置なし(レセ印字あり)」→着処を選ぶとP部位が入る。②ネオステリングリーン処方時の病名が違う:P病名では入れず、病名は「Stom(アフタ性口内炎)」を選ぶ(部位は入れない)。③ネオステリングリーン処方時の薬剤情報料10点の取りこぼし:お薬手帳→「記載なし」を選ぶ(スキップで飛ばさない)。④ナイトガードSET時のコメント忘れ:ワープロ→摘要入力→「上顎床装置セット」と入力する。⑤小児歯式入力ミスが数件あり:再初診の時は業務記録簿にも歯式を記入する。⑥小児EPP:永久歯10本から→基本検査、永久歯9本まで→混合歯列期検査。"}, {"no": 51, "date": "2022/04/28", "category": "歯周病治療(SPT・P重防・医管)", "title": "SPT、P重防時の医管入力について【川崎真紀】", "content": "SPT、P重防の時の医管入力について再確認。摘要に「全顎スケーリングしました」「左下4から7までSRPしました」等とコメント入力すると医管算定できる。"}, {"no": 52, "date": "2022/01/31", "category": "歯周病治療(SPT・P重防・医管補足)", "title": "SPT、P重防時の医管算定についての補足【川崎真紀】", "content": "大谷先生に再確認。「SPT、P重防のみの入力の時は医管は算定できない」(他にC処などで歯を削って入力した場合は算定できる)。SPTのみ入力の場合でも、メディアのコンピューターでは「医管を算定しますか?」と出てしまうが自分で判断して入力しないこと(コンピューター側で出ないようにはできないとのこと)。また毎月のレセプトチェックでニチイさんが医管入力分を消していて、患者に過剰金が発生してしまっている。入力時は注意すること。"}, {"no": 53, "date": "2022/01/29", "category": "レセプト・カルテ(修正例まとめ)", "title": "歯科衛生士の方へ(修正の多い例・疑問点まとめ)【川崎真紀】", "content": "修正の多い例・疑問点のまとめ(共有してミスを防止)。①SPTとP重防時のパノラマ:前回パノラマ撮影から1年経過していれば点数が取れる(入力時は「パノラマ前準備型撮影」を選ばないよう注意)。②15歳になり病名がGからPに変わる時:G病名に上書きしてP病名に変更する(同部位で病名を2つ作らない)。③妊婦検診や無料検診のあとの再診入力:同じ月なら再診で「検診からの移行」と摘要にコメントを入れる。④CCDや口腔内写真:歯が1本の人は5枚では算定できない。点数が取れるのは歯があるブロックごとに1枚(P病名に関する点数のため粘膜の写真を撮った場合も算定できない)。例1:上顎フルデンチャー・下顎7-7まである場合は3ブロックなので3枚算定可。例2:上下顎とも前歯しか残っていない場合は2ブロックなので2枚算定可。⑤ナイトガード:病名に歯式は入れない(SET時に摘要へ「上顎床装置装着」とコメントを入れる。部位は入れなくてOK)。⑥SP以外でネオステリン処方する時:お薬手帳は出していないため「お薬手帳記載なし」を選ぶ(スキップは不可)。病名は「アフタ」→投薬(SP+投薬はダメ、SPの時のみ)。⑦医管入力:SPT、P重防時は測定してもよいが入力はできない。⑧Ceについて:Ceは継続管理のため1回しか来院しない人には算定しない。シーラントをやりたい所やCになりそうな歯は選ばず、将来的にう蝕になりにくそうな歯を選ぶ。"}, {"no": 54, "date": "2022/01/20", "category": "歯周病治療(小児EPP)", "title": "衛生士の皆さんへ(小児EPPのレセプト入力)【川崎真紀】", "content": "小児のEPPのレセプト入力時の間違いが多い。9歯までは混合歯列期検査、10歯からは基本検査で入力する。"}, {"no": 55, "date": "2022/05/02", "category": "カルテ入力(自然脱落)", "title": "ケアDHの方へ(自然脱落の入力方法について)【永友奈々子】", "content": "自然脱落の入力方法について(大谷先生に確認済みの方法を共有)。①部位病名からP部位に変更(上書き)する。②ワープロ→摘要入力→部位を選ぶ→「自然脱落」を選ぶ→来院日の日付を入力する。あまり遭遇する事はないかもしれないが周知。(添付:入力例のスクリーンショット「自然脱落 2 令和4年5月1日」等)"}, {"no": 56, "date": "2025/12/05", "category": "カルテ入力(歯科疾患管理・年齢区分)", "title": "検査とレセ印字ありの入力について【小林さち子/後日訂正あり】", "content": "P混検と基本検査の保険点数算定の区分を細かく分けるようにしたため入力時に注意(大谷先生より)。7才(平成30年生まれ)→P混検。8才(平成29年生まれ)→大臼歯・小臼歯が両方あって永久歯が10本以上ある場合は基本検査。9才(平成28年生まれ)→大臼歯・小臼歯が両方あって永久歯が10本以上あれば基本検査。10才(平成27年生まれ)→永久歯が10本以上あれば基本検査。※Pの処置が何もなく、Pの歯式を入れるためだけに入力する場合は「普処」ではなく「診断のみ」と入れる。※2026/01/05にニチイからの算定変更を受けて内容が更新されています(次項No.57参照)。"}, {"no": 57, "date": "2026/01/05", "category": "カルテ入力(歯科疾患管理・年齢区分/訂正版)", "title": "【※加筆あり】検査とレセ印字ありの入力について【山下愛美/No.56の訂正版】", "content": "ニチイさんより算定について変更があったため再度上げ直し(2025/12/05分・No.56の訂正・更新版)。7才(平成30年生まれ)→P混検。8才(平成29年生まれ)→大臼歯・小臼歯が両方ある、または3番か4番が1本でも生えていて永久歯が10本以上ある場合は基本検査。9才(平成28年生まれ)→永久歯が10本以上あれば基本検査。※Pの処置が何もなく、Pの歯式を入れるためだけに入力する場合は「普処」ではなく「診断のみ」と入れる。"}, {"no": 58, "date": "2025/07/31", "category": "カルテ入力(在歯管・算定可否一覧)", "title": "医管(在歯管)【小林さち子】", "content": "医管(在歯管)が算定できる治療・算定不可な治療をまとめた表を各入力PCの上に掲示(一部確認中のものもあり、確認でき次第修正)。算定できる主な治療:う蝕処置、抜髄、感根処、根管、根充、SC、SRP、SPT、P重防、歯周、生PZ、失PZ、充形(CR)、修形(KP)、印象、支台築造、コア印象、印象採得、光学印象、咬合印象、抜歯手術、口腔内消毒手術、歯周外科手術、Hys処、T-cond、歯冠形態修正。算定不可:EPP、SP、抜糸、義歯調整、BT、TF、SET、義歯修理、リベース、パントモ、デンタル(※impは算定できます!義歯やナイトガードなど)。(添付:一覧表の写真)"}, {"no": 59, "date": "2026/07/08", "category": "レントゲン撮影(ケア・パノラマ)", "title": "ケアでのパノラマの入力について【吉田佳奈】", "content": "ケアでパノラマを撮った時に算定を「部分パノラマ」で入力している方がいるが、正しくは402点のパノラマ撮影として入力する。「部分パノラマ」では入力しないこと。"}, {"no": 60, "date": "2025/06/22", "category": "カルテ入力(CAD/CAMセメント選択)", "title": "重要 CADのセメントについて【志賀英俊】", "content": "5月分のレセプトで、CADのセット時のセメントをグラスアイオノマーで算定してしまっているものが多くあった。グラスアイオノマーセメントでは内面処理加算が算定できず返戻になるため注意するよう歯科医師会の先生より連絡があった。各ドクターは6月の入力がグラスアイオノマーになっていないか確認すること。"}, {"no": 61, "date": "2025/03/04", "category": "医院間連携(分院)", "title": "分院報告(休診日の本院受診について)【志賀英俊】", "content": "今後、分院の患者さんが分院の休診日に本院にかかる場合、通常通り費用を頂くようにする。その場合は他の急患と同様に再診で打って、必要な入力をして大丈夫。ただし摘要に「同一法人で休診日のため」と入れること。"}, {"no": 62, "date": "不明(金曜日)", "category": "歯周病治療(SPT・フラップ・カルテ入力)", "title": "フラップやその他の処置後のカルテ入力について【大谷武】", "content": "6月からはSPTの途中などで処置を行い、その後にSPTに戻る場合、摘要コメントが必要となる。メディアの歯科コンの場合、19番から入って点数を入れた後、コメント欄があるので行った処置を入れること。コメントが無いと返戻になる。"}, {"no": 63, "date": "不明(金曜日/翌日)", "category": "カルテ入力(義歯・咀嚼機能検査)", "title": "義歯装着と有床義歯咀嚼機能検査について【大谷武/林咲穂】", "content": "義歯セットと同日の有床義歯咀嚼機能検査の保険算定について、6月からは検査機材の施設届けが不要になった(グルコース分析装置の届出も不要に)。義歯セット時に咀嚼能力検査を同日算定するにはセット前に事前検査が必要(事前検査が無いと基本的に同日検査は算定できない)。その後、義歯セットして症状が改善したかを再検査する。以降は3ヶ月ごとに検査してよい(義歯や欠損を理由にする場合は多数歯欠損などの状態の摘要記載を守ること)。【林咲穂による追記・メディアへの確認結果】義歯セット前・セット後に加え、その後の義歯調整時も6ヶ月以内月1回算定できる(届出不要)。検査は咀嚼能力測定または咬合圧測定のどちらかで、セット前に使った方法を最後まで使用する。実際の入力方法も確認済みのため、別途共有予定とのこと。"}, {"no": 64, "date": "2026/08/04", "category": "歯科技工(テンポラリークラウン・加算要件)", "title": "テンポラリークラウンと歯科技工所ベースアップ支援料の加算について【大谷武】", "content": "テンポラリークラウンを装着した際、技工所に発注して作った物でなければ歯技ベア(歯科技工所ベースアップ支援料)の加算はつけられない。技工指示書が無ければ後で問題になる可能性がある。加算は1装置に1回つくものなので、ブリッジならロングスパンの物でも1回、義歯修理であれば幾つクラスプを同時に交換しても1回となる。確かめて算定すること。作ってくれた技工所名はカルテに入力する必要がある。"}, {"no": 65, "date": "2026/08/04", "category": "カルテ入力(診断のみ・ワープロ入力)", "title": "診断のみの場合のワープロ入力について【大谷武】", "content": "ドクターや衛生士が診断のみでカルテ記載したい時は、ワープロ(w)からワープロ入力すること。病名から入力すると、レセプトに処置は無いのに病名が記載されてしまい、消すのが一苦労になる(P部位を入れないといけない事とは別の話)。以前から伝えている通り、カルテ記載とレセプト入力は違うので注意する。"}, {"no": 66, "date": "2026/08/03", "category": "保険点数(顎関節脱臼整復術)", "title": "顎関節脱臼非観血的整復術の保険点数算定について【大谷武】", "content": "顎関節脱臼非観血的整復術は片顎で400点、両顎で800点となっている。整復したらタオルやサポーターのような物で固定しておく方が良い(経験上、一度外れると固定せずにおくとすぐまた外れてしまう)。歯科材料には無いが、顎を固定するサポーターも市販されている。"}, {"no": 67, "date": "不明(2026年7月頃)", "category": "レセプト・カルテ(月次エラー傾向)", "title": "Drの皆さんへ(6月のレセプトチェックで多かったエラー)", "content": "6月のレセプトチェックで特に多かったエラーのうち、すぐに改善できるものを共有(気をつけて入力すること)。・歯リハを算定する際は義歯不適病名をつける。・デンタルを算定する際は必ず病名をつける(P部位で算定しない)。・初診であげたP病名は必ず毎月病名にあげる。・P部位に含めていない智歯はPerico病名、P部位に含めている智歯はPer病名で抜歯する。・疑い病名のまま、疑い病名からの移行病名のまま処置をしない(疑い病名で算定できるのはデンタルのみ)。・P部位にない歯(欠損歯)に処置を算定しないよう、入力後にしっかり確認する。引き続きカルテ記載・レセプトについて厳格化(評価時の査定)を行っていくため、聞かなかった・知らなかったということのないように。改善が見られない場合は降格を検討する。"}];

  const listEl = document.getElementById('list');

  const footTotalEl = document.getElementById('footTotal');

  const RISK_TERMS = ['返戻', '査定', '指導', '注意', '中止'];

  let activeGroup = null;   // カテゴリ大分類での絞り込み
  let sortDesc = true;      // true: 新しい順

  function groupOf(category) {
    if (!category) return '未分類';
    const i = category.indexOf('(');
    return i === -1 ? category : category.slice(0, i);
  }

  function parseDate(d) {
    const m = /^(\d{4})\/(\d{2})\/(\d{2})$/.exec(d || '');
    return m ? new Date(+m[1], +m[2] - 1, +m[3]).getTime() : null;
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function escapeRegex(s) {
    return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }

  // タグの外側(プレーンテキスト部分)にのみ検索キーワードの <mark> を適用する
  function highlightOutsideTags(html, terms) {
    if (!terms.length) return html;
    return html.replace(/<[^>]+>|[^<]+/g, (chunk) => {
      if (chunk.charAt(0) === '<') return chunk;
      let out = chunk;
      for (const t of terms) {
        if (!t) continue;
        out = out.replace(new RegExp(escapeRegex(t), 'gi'), (m) => '<mark class="hit">' + m + '</mark>');
      }
      return out;
    });
  }

  function renderContent(text, queryTerms) {
    let html = escapeHtml(text || '');
    const riskRe = new RegExp(RISK_TERMS.map(escapeRegex).join('|'), 'g');
    html = html.replace(riskRe, (m) => '<span class="risk">' + m + '</span>');
    html = highlightOutsideTags(html, queryTerms);
    return html;
  }

  function buildChips() {
    const counts = new Map();
    for (const row of DATA) {
      const g = groupOf(row.category);
      counts.set(g, (counts.get(g) || 0) + 1);
    }
    const groups = [...counts.entries()].sort((a, b) => b[1] - a[1]);

    chipRowEl.innerHTML = '';
    const allChip = makeChip('すべて', DATA.length, null);
    chipRowEl.appendChild(allChip);
    for (const [g, c] of groups) {
      chipRowEl.appendChild(makeChip(g, c, g));
    }
  }

  function makeChip(label, count, value) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'chip' + (activeGroup === value ? ' active' : '');
    btn.innerHTML = escapeHtml(label) + '<span class="count">' + count + '</span>';
    btn.addEventListener('click', () => {
      activeGroup = (activeGroup === value) ? null : value;
      render();
    });
    return btn;
  }

  function render() {
    const raw = searchEl.value.trim();
    clearBtn.classList.toggle('visible', raw.length > 0);
    const terms = raw.split(/\s+/).filter(Boolean);

    let rows = DATA.filter((row) => {
      if (activeGroup && groupOf(row.category) !== activeGroup) return false;
      if (!terms.length) return true;
      const hay = (row.category + ' ' + row.title + ' ' + row.content).toLowerCase();
      return terms.every((t) => hay.includes(t.toLowerCase()));
    });

    rows = rows.slice().sort((a, b) => {
      const da = parseDate(a.date);
      const db = parseDate(b.date);
      if (da === null && db === null) return b.no - a.no;
      if (da === null) return 1;
      if (db === null) return -1;
      const diff = da - db;
      return sortDesc ? -diff : diff;
    });

    matchCountEl.textContent = rows.length;
    listEl.innerHTML = '';
    emptyEl.classList.toggle('visible', rows.length === 0);

    const frag = document.createDocumentFragment();
    for (const row of rows) {
      const li = document.createElement('li');
      li.className = 'card';
      const titleHtml = highlightOutsideTags(escapeHtml(row.title || ''), terms);
      const bodyHtml = renderContent(row.content, terms);
      li.innerHTML =
        '<div class="card-head">' +
          '<span class="card-tag">' + escapeHtml(row.category || '未分類') + '</span>' +
          '<span class="card-date">' + escapeHtml(row.date || '日付不明') + '</span>' +
          '<span class="card-no">No.' + row.no + '</span>' +
        '</div>' +
        '<h2 class="card-title">' + titleHtml + '</h2>' +
        '<p class="card-body">' + bodyHtml + '</p>';
      frag.appendChild(li);
    }
    listEl.appendChild(frag);
  }

  searchEl.addEventListener('input', render);
  clearBtn.addEventListener('click', () => {
    searchEl.value = '';
    searchEl.focus();
    render();
  });
  sortToggleEl.addEventListener('click', () => {
    sortDesc = !sortDesc;
    sortToggleEl.textContent = sortDesc ? '新しい順' : '古い順';
    render();
  });

  totalCountEl.textContent = DATA.length;
  footTotalEl.textContent = DATA.length;
  buildChips();
  render();
</script>
</body>
</html>

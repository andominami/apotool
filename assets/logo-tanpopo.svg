<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -55 300 395" width="300" height="395">
  <defs>
    <style>
      .leaf { fill: #3c9a3c; }
      .leaf-vein { fill: none; stroke: #ffffff; stroke-width: 6; stroke-linecap: round; }
      .stem { fill: none; stroke: #3c9a3c; stroke-width: 10; stroke-linecap: round; }
      .petal-ring { fill: #f4941e; }
      .petal-ring-outline { fill: none; stroke: #f4941e; stroke-width: 9; }
      .face { fill: #ffd93d; }
      .eye { fill: #7a4a10; }
      .smile { fill: none; stroke: #7a4a10; stroke-width: 4; stroke-linecap: round; }
      .word { fill: #f4941e; font-family: "Comic Sans MS", "Noto Sans JP", sans-serif; font-weight: 700; }
    </style>
  </defs>

  <!-- leaves -->
  <path class="leaf" d="M150 210
    C 90 215, 40 235, 15 275
    C 45 268, 75 262, 100 258
    C 60 275, 30 300, 15 330
    C 55 320, 95 300, 128 275
    C 118 300, 118 315, 122 335
    C 145 305, 158 275, 150 250 Z" />
  <path class="leaf" d="M150 210
    C 210 215, 260 235, 285 275
    C 255 268, 225 262, 200 258
    C 240 275, 270 300, 285 330
    C 245 320, 205 300, 172 275
    C 182 300, 182 315, 178 335
    C 155 305, 142 275, 150 250 Z" />
  <path class="leaf-vein" d="M40 268 C 80 262, 110 250, 140 232" />
  <path class="leaf-vein" d="M260 268 C 220 262, 190 250, 160 232" />

  <!-- stems -->
  <path class="stem" d="M150 235 L150 165" />
  <path class="stem" d="M198 175 L222 130" />

  <!-- small flower (behind/right) -->
  <circle class="petal-ring-outline" cx="228" cy="98" r="46" />
  <circle class="face" cx="228" cy="98" r="34" />
  <circle class="eye" cx="217" cy="92" r="4" />
  <circle class="eye" cx="239" cy="92" r="4" />
  <path class="smile" d="M215 105 Q228 116 241 105" />

  <!-- big flower -->
  <circle class="petal-ring" cx="140" cy="95" r="72" />
  <circle class="face" cx="140" cy="95" r="58" />
  <circle class="eye" cx="120" cy="85" r="6.5" />
  <circle class="eye" cx="160" cy="85" r="6.5" />
  <path class="smile" d="M113 103 Q140 128 167 103" stroke-width="6" />

  <!-- TANPOPO text arched over the big flower -->
  <path id="arc" d="M 38 80 A 102 102 0 0 1 236 60" fill="none" />
  <text class="word" font-size="30" letter-spacing="1">
    <textPath href="#arc" startOffset="0">TANPOPO</textPath>
  </text>
</svg>

<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>保険算定ルールノート</title>
<meta name="description" content="保険算定で間違えやすいルールをキーワード検索でまとめて読めるナレッジサイト">
<link rel="icon" type="image/png" href="assets/logo-tanpopo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="#/">
      <img class="brand-mark" src="assets/logo-tanpopo.png" alt="" aria-hidden="true">
      <span class="brand-text">
        <span class="brand-title">保険算定ルールノート</span>
      </span>
    </a>
    <div class="search-wrap">
      <label class="sr-only" for="search-input">キーワード検索</label>
      <input id="search-input" type="search" autocomplete="off"
             placeholder="キーワードで検索（例: SPT、パノラマ、健診）">
      <button id="search-clear" type="button" aria-label="検索をクリア">&times;</button>
    </div>
    <button id="post-open-btn" type="button" class="post-open-btn">投稿 ✏️</button>
  </div>
</header>

<div class="view-tabs-wrap">
  <div class="view-tabs" role="tablist" aria-label="表示切り替え">
    <button type="button" class="view-tab active" data-view="current" role="tab" aria-selected="true">
      現在の情報
    </button>
    <button type="button" class="view-tab" data-view="archived" role="tab" aria-selected="false">
      🗂️ アーカイブ
    </button>
  </div>
</div>

<main class="layout">
  <aside class="sidebar" id="sidebar">
    <h2 class="sidebar-title">カテゴリ</h2>
    <ul id="category-list" class="category-list"></ul>
  </aside>

  <section class="content">
    <div class="content-toolbar">
      <p id="result-count" class="result-count" role="status" aria-live="polite"></p>
      <label class="sort-label">
        並び替え
        <select id="sort-select">
          <option value="date-desc">新しい順</option>
          <option value="date-asc">古い順</option>
          <option value="no-asc">No.順</option>
          <option value="views-desc">閲覧数順</option>
        </select>
      </label>
    </div>

    <ul id="rule-list" class="rule-list"></ul>

    <p id="empty-state" class="empty-state" hidden>
      該当するルールが見つかりませんでした。別のキーワードで検索してください。
    </p>
  </section>
</main>

<div id="detail-overlay" class="detail-overlay" hidden>
  <div class="detail-panel" role="dialog" aria-modal="true" aria-labelledby="detail-title">
    <button id="detail-close" class="detail-close" type="button" aria-label="閉じる">&times;</button>
    <div id="detail-body" class="detail-body"></div>
  </div>
</div>

<div id="post-overlay" class="detail-overlay" hidden>
  <div class="detail-panel post-panel" role="dialog" aria-modal="true" aria-labelledby="post-title">
    <button id="post-close" class="detail-close" type="button" aria-label="閉じる">&times;</button>
    <h2 id="post-title" class="post-title">投稿フォームを開く</h2>
    <p class="post-desc">院内共通のパスワードを入力してください。</p>
    <form id="post-form" class="post-form" autocomplete="off">
      <label class="sr-only" for="post-password">パスワード</label>
      <input id="post-password" type="password" placeholder="パスワード" autocomplete="off">
      <button type="submit">開く</button>
    </form>
    <p id="post-error" class="post-error" hidden>パスワードが違います。</p>
  </div>
</div>

<footer class="site-footer">
  <p>院内向け 保険算定ルール検索サイト &mdash; データは <code>data/rules.json</code> を編集して更新できます。</p>
</footer>

<script src="assets/app.js"></script>
</body>
</html>
